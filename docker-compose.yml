# Banco de dados para desenvolvimento local.
#   docker compose up -d
#   npm run db:migrate && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: meb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meb
      POSTGRES_PASSWORD: meb
      POSTGRES_DB: meb
    ports:
      - '5432:5432'
    volumes:
      - meb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meb -d meb']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meb-pgdata:
